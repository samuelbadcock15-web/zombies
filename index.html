<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Haunted Mansion Vault - Outbreak Edition</title>
    <style>
        body { margin: 0; background: #0c0806; color: #fff; font-family: monospace; overflow: hidden; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        #gui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: none; }
        #stats { position: absolute; top: 20px; left: 20px; font-size: 14px; font-weight: bold; background: rgba(30,20,15,0.9); color: #d4af37; padding: 8px 12px; border: 1px solid #6b4c35; line-height: 1.4; }
        #score-board { position: absolute; top: 20px; right: 20px; font-size: 20px; font-weight: bold; background: #140d0a; color: #ffaa00; padding: 10px 20px; border: 2px solid #8b5a2b; pointer-events: auto; }
        #round-display { position: absolute; bottom: 40px; left: 20px; font-size: 48px; font-weight: bold; color: #cc2222; text-shadow: 2px 2px #000; }
        #msg-box { position: absolute; bottom: 40px; width: 100%; text-align: center; left: 0 }
        #text { display: inline-block; background: rgba(35,24,18,0.95); color: #f0e0d0; border: 2px solid #8b5a2b; padding: 15px; min-width: 350px; font-weight: 700; text-transform: uppercase; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%); pointer-events: none; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #ffaa00; }
        #crosshair::before { top: 4px; left: -10px; width: 30px; height: 2px; }
        #crosshair::after { top: -10px; left: 4px; width: 2px; height: 30px; }
        #click-prompt { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,10,8,0.95); color: #d4af37; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; z-index: 100; text-align: center; }
        .menu-btn { background: #3a2418; color: #ffd700; border: 2px solid #8b5a2b; padding: 15px 30px; font-size: 22px; font-family: monospace; font-weight: bold; cursor: pointer; margin: 10px; text-transform: uppercase; box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: auto; }
        .menu-btn:hover { background: #5c3a29; color: #fff; }
        #lobby-screen { display: none; flex-direction: column; align-items: center; justify-content: center; }
        .lobby-slot { background: rgba(30,20,15,0.9); border: 1px solid #6b4c35; padding: 12px 25px; margin: 6px; min-width: 300px; font-size: 18px; display: flex; justify-content: space-between; }
        #damage-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,0,0,0); pointer-events: none; transition: background 0.1s ease; z-index: 5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div id="damage-overlay"></div>

<!-- MAIN MENU & LOBBY OVERLAY -->
<div id="click-prompt">
    <div id="main-menu">
        <h1 style="color: #ffaa00; font-size: 48px; text-shadow: 3px 3px #000; margin-bottom: 10px;">HAUNTED MANSION VAULT</h1>
        <p style="color: #b8860b; margin-bottom: 30px;">OUTBREAK EDITION - MULTIPLAYER</p>
        <button class="menu-btn" onclick="startSinglePlayer()">1 Player Solo</button>
        <button class="menu-btn" onclick="openMultiplayerLobby()">Multiplayer Lobby (1-4)</button>
    </div>
    
    <div id="lobby-screen" style="display:none;">
        <h2 style="color: #ffaa00; font-size: 32px; margin-bottom: 10px;">LOBBY NO. 1 - ENDLESS</h2>
        <div id="lobby-slots-container"></div>
        <p id="lobby-status-msg" style="color: #b8860b; margin: 15px; font-size: 18px;">Waiting for players...</p>
        <button class="menu-btn" id="ready-btn" onclick="toggleReadyState()">Click to Ready Up</button>
    </div>
</div>

<div id="gui">
    <div id="stats">WASD + LOOK | KEYS 1-5 SWITCH | G THROW GRENADE | C PLACE CLAYMORE<br>HOLD LMB ON FALLEN TEAMMATES TO REVIVE!</div>
    <div id="score-board">CREDITS: <span id="score-val">500</span></div>
    <div id="round-display">ROUND <span id="round-val">I</span></div>
    <div id="crosshair"></div>
    <div id="msg-box"><div id="text">HAUNTED PROTOCOL ENGAGED. 500 CREDITS LOADED.</div></div>
</div>
<canvas id="virtualArcadeCanvas" style="display:none" width="512" height="512"></canvas>
<canvas id="gunTacticalCanvas" style="display:none" width="512" height="512"></canvas>
<canvas id="mysteryBoxScreenCanvas" style="display:none" width="512" height="512"></canvas>
<canvas id="upgradeMachineScreenCanvas" style="display:none" width="512" height="512"></canvas>

<!-- Perk Canvases -->
<canvas id="jugCanvas" style="display:none" width="512" height="512"></canvas>
<canvas id="quickReviveCanvas" style="display:none" width="512" height="512"></canvas>
<canvas id="doubleTapCanvas" style="display:none" width="512" height="512"></canvas>
<canvas id="staminUpCanvas" style="display:none" width="512" height="512"></canvas>

let isMultiplayer = false;
let mySlot = 1;
let isReady = false;
let remotePlayers = {};
let isDowned = false;

const $ = id => document.getElementById(id), sCanvas = $('virtualArcadeCanvas'), sCtx = sCanvas.getContext('2d'), txtDiv = $('text'), promptDiv = $('click-prompt');

const tacticalCanvas = $('gunTacticalCanvas');
const tacticalCtx = tacticalCanvas.getContext('2d');
const gunTacticalTexture = new THREE.CanvasTexture(tacticalCanvas);

const boxScreenCanvas = $('mysteryBoxScreenCanvas');
const boxScreenCtx = boxScreenCanvas.getContext('2d');
const boxScreenTexture = new THREE.CanvasTexture(boxScreenCanvas);

const upgScreenCanvas = $('upgradeMachineScreenCanvas');
const upgScreenCtx = upgScreenCanvas.getContext('2d');
const upgScreenTexture = new THREE.CanvasTexture(upgScreenCanvas);

const jugCtx = $('jugCanvas').getContext('2d');
const jugTex = new THREE.CanvasTexture($('jugCanvas'));
const qrCtx = $('quickReviveCanvas').getContext('2d');
const qrTex = new THREE.CanvasTexture($('quickReviveCanvas'));
const dtCtx = $('doubleTapCanvas').getContext('2d');
const dtTex = new THREE.CanvasTexture($('doubleTapCanvas'));
const suCtx = $('staminUpCanvas').getContext('2d');
const suTex = new THREE.CanvasTexture($('staminUpCanvas'));

let playerPoints = 500;
let currentWeapon = 1; 
let playerBites = 0;
let maxBites = 3; 
let isGameOver = false;

let hasJuggerNog = false;
let hasQuickRevive = false;
let quickReviveShield = 2; 
let hasDoubleTap = false;
let hasStaminUp = false;

let currentRound = 1;
let zombiesToSpawnRemaining = 0;
let activeZombiesCount = 0;
let roundActive = false;
let lastSpawnTime = 0;
let spawnInterval = 2500;

let baseWeaponData = {
    1: { name: "PISTOL", damage: 1, maxAmmo: 200, range: 60, headDamage: 3 },
    2: { name: "AUTO PISTOL", damage: 1, maxAmmo: 200, range: 60, headDamage: 3 },
    3: { name: "HEAVY SHOTGUN / RIFLE", damage: 2, maxAmmo: 150, range: 80, headDamage: 5 },
    4: { name: "AUTOMATIC RIFLE", damage: 2, maxAmmo: 150, range: 75, headDamage: 4 },
    5: { name: "RAY PISTOL", damage: 10, maxAmmo: 100, range: 140, headDamage: 25 },
    6: { name: "FRAG GRENADE", damage: 0, maxAmmo: 0, range: 0, headDamage: 0 },
    7: { name: "CLAYMORE MINE", damage: 0, maxAmmo: 0, range: 0, headDamage: 0 }

let hasAutomaticPistol = false;
let hasRifle = false;
let hasAutoRifle = false;
let hasRayPistol = false;
let isLmbHeldDown = false;
let lastShotTime = 0;
const autoFireRateMs = 120; 

let grenadeCount = 2;
let grenadeUpgradeLevel = 0;
let claymoreCount = 2;
let claymoreUpgradeLevel = 0;

const activeGrenades = [];
const activeClaymores = [];

let robotMercState = {
    active: false,
    health: 100,
    maxHealth: 100,
    durationTimer: 0,
    level: 1,
    isBeingOverrun: false,
    overrunProgress: 0,
    lastProximitySpeechTime: 0
};

// Multiplayer Lobby UI Handling
function openMultiplayerLobby() {
    isMultiplayer = true;
    $('main-menu').style.display = 'none';
    $('lobby-screen').style.display = 'flex';
}

function toggleReadyState() {
    isReady = !isReady;
    $('ready-btn').innerText = isReady ? "Cancel Ready" : "Click to Ready Up";
    $('ready-btn').style.background = isReady ? "#2e5c2e" : "#3a2418";
    socket.emit('set_ready', isReady);
}

socket.on('update_lobby', (state) => {
    let container = $('lobby-slots-container');
    container.innerHTML = '';
    let connectedCount = Object.keys(state.players).length;

    for (let i = 1; i <= 4; i++) {
        let playerInSlot = Object.values(state.players).find(p => p.slot === i);
        let div = document.createElement('div');
        div.className = 'lobby-slot';
        if (playerInSlot) {
            if (playerInSlot.id === socket.id) mySlot = i;
            div.innerHTML = `<span>Player ${i} (${playerInSlot.id === socket.id ? 'You' : 'Connected'})</span> <span style="color: ${playerInSlot.ready ? '#00ff66' : '#ffaa00'}">${playerInSlot.ready ? 'READY' : 'WAITING'}</span>`;
        } else {
            div.innerHTML = `<span>Player ${i}</span> <span style="color: #666;">EMPTY</span>`;
        }
        container.appendChild(div);
    }

    let allPlayers = Object.values(state.players);
    let readyCount = allPlayers.filter(p => p.ready).length;
    if (allPlayers.length > 0 && readyCount === allPlayers.length) {
        $('lobby-status-msg').innerText = "All players ready! Starting game...";
    } else {
        let needed = Math.max(0, allPlayers.length - readyCount);
        $('lobby-status-msg').innerText = needed > 0 ? `System saying: ${needed} more person(s) need to ready up!` : `Lobby has ${connectedCount}/4 players. Waiting...`;
    }
});

socket.on('start_game', (playersState) => {
    promptDiv.style.display = 'none';
    $('gui').style.display = 'block';
    document.body.requestPointerLock();
    initAudio();

    const CORNER_SPAWNS = [
        { x: -18, z: 18 },
        { x: 18, z: 18 },
        { x: -18, z: -18 },
        { x: 18, z: -18 }
    ];
    let spawn = CORNER_SPAWNS[mySlot - 1] || CORNER_SPAWNS[0];
    playerRig.position.set(spawn.x, 3.0, spawn.z);

    Object.values(playersState).forEach(p => {
        if (p.id !== socket.id) {
            createRemotePlayerMesh(p.id, p.slot);
        }
    });

    if (!roundActive && currentRound === 1) startRound(1);
});

function createRemotePlayerMesh(id, slot) {
    let group = new THREE.Group();
    let bodyMat = new THREE.MeshStandardMaterial({ color: slot === 1 ? 0xffd700 : (slot === 2 ? 0x00a8ff : (slot === 3 ? 0xff3300 : 0x00ff66)) });
    let torso = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.4, 0.6), bodyMat);
    torso.position.y = 1.0;
    let head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), bodyMat);
    head.position.y = 2.0;
    group.add(torso, head);
    scene.add(group);
    remotePlayers[id] = { group: group, slot: slot };
}

socket.on('remote_player_moved', (p) => {
    if (remotePlayers[p.id]) {
        remotePlayers[p.id].group.position.set(p.x, p.y, p.z);
        remotePlayers[p.id].group.rotation.y = p.yaw;
    }
});

socket.on('update_players_state', (players) => {
    if (players[socket.id]) {
        let me = players[socket.id];
        isDowned = me.isDowned;
        if (isDowned) {
            txtDiv.innerHTML = "YOU ARE DOWNED! HAVE A TEAMMATE HOLD LMB ON YOU TO REVIVE!";
        }
    }
});

function startSinglePlayer() {
    promptDiv.style.display = 'none';
    $('gui').style.display = 'block';
    document.body.requestPointerLock();
    initAudio();
    if (!roundActive && currentRound === 1) startRound(1);
}

const unhiredLines = [
    "Penumbra industries veteran at your service, marine! Five hundred credits and I'll clear this path!",
    "You want heavy metal firepower? Pay the toll, soldier and let's party!",
    "I've survived worse than this haunted estate. Hire me for 500 credits and watch these phantoms scatter!",
    "Looking for a shield? Drop 500 credits and I'll lead the vanguard charge!"
];

const hiredLines = [
    "Heavy metal activated! Locking and loading for Vanguard Company!",
    "Get to the extraction point! I've got your flank covered, marine!",
    "Come on! Let's party! No ghoul gets past these dual barrels!",
    "Vanguard ship is waiting in the clouds! Stay frosty and keep pumping lead!"
];

let lastUnhiredLineIdx = -1;
let lastHiredLineIdx = -1;

function getUniqueRandomLine(isHired) {
    let pool = isHired ? hiredLines : unhiredLines;
    let lastIdx = isHired ? lastHiredLineIdx : lastUnhiredLineIdx;
    let idx;
    do {
        idx = Math.floor(Math.random() * pool.length);
    } while (idx === lastIdx && pool.length > 1);

    if (isHired) lastHiredLineIdx = idx;
    else lastUnhiredLineIdx = idx;

    return pool[idx];
}

    jugCtx.strokeStyle = '#ff2222'; jugCtx.lineWidth = 14; jugCtx.strokeRect(10,10,492,492);

    qrCtx.fillStyle = '#00a8ff'; qrCtx.font = 'bold 36px monospace'; qrCtx.textAlign = 'center';
    qrCtx.fillText("QUICK REVIVE", 256, 80);

    dtCtx.fillStyle = '#ffffff'; dtCtx.font = 'bold 24px monospace';
    dtCtx.fillText(hasDoubleTap ? "ACQUIRED (2X FIRE/DMG)" : "COST: 2000 CREDITS", 256, 200);

    suCtx.fillStyle = '#002200'; suCtx.fillRect(0,0,512,512);

    suCtx.fillStyle = '#ffff00'; suCtx.font = 'bold 36px monospace'; suCtx.textAlign = 'center';
    suCtx.fillText("STAMIN-UP", 256, 80);
    suCtx.fillStyle = '#ffffff'; suCtx.font = 'bold 24px monospace';
    suCtx.fillText(hasStaminUp ? "ACQUIRED (SPEED BOOST)" : "COST: 2000 CREDITS", 256, 200);

let mysteryBoxActive = false;
let mysteryBoxReadyToCollect = false;
let mysteryBoxTimer = 0;
let mysteryBoxUsesCount = 0;
let mysteryBoxCurrentRoom = 0; 
let mysteryBoxCyclingReward = "PISTOL"; 
let mysteryBoxRewardType = 1; 
let mysteryBoxFadeAlpha = 1.0;
let mysteryBoxMapHologramGroup = new THREE.Group();

const boxRoomLocations = [
    { name: "GRAND HAUNTED HALL", pos: new THREE.Vector3(0, 0, -140) },
    { name: "BALLROOM ARENA", pos: new THREE.Vector3(0, 0, -140) },
    { name: "FLOODED CRYPT", pos: new THREE.Vector3(0, 0, -310) },
    { name: "UNDERGROUND CATACOMBS", pos: new THREE.Vector3(0, -79.8, -330) }
];

let upgradeMachineActive = false;
let upgradeMachineReadyToCollect = false;
let upgradeMachineTimer = 0;
let upgradeMachineWeaponSlot = 1;

function toRoman(num) {
    const lookup = {M:1000,CM:900,D:500,CD:400,C:100,XC:90,L:50,XL:40,X:10,IX:9,V:5,IV:4,I:1};
    let roman = '';
    for (let i in lookup) {
        while (num >= lookup[i]) { roman += i; num -= lookup[i]; }
    }
    return roman || "I";
}

function getWeaponStat(weaponId, stat) {
    let base = baseWeaponData[weaponId][stat];
    let lvl = weaponUpgradeLevels[weaponId];
    if (stat === 'damage' || stat === 'headDamage') {
        let dmg = Math.floor(base + (lvl * 2.5));
        return hasDoubleTap ? dmg * 2 : dmg;
    }
    if (lvl === 0) return base;
    if (stat === 'maxAmmo') return Math.floor(base + (lvl * 60));        
    if (stat === 'range') return base * (1 + lvl * 0.15); 
    return base;
}

function addPoints(amt) {
    if (isGameOver) return;
    playerPoints += amt;
    $('score-val').innerText = playerPoints;
}

function updateTacticalHUD() {
    let current = ammoReserves[currentWeapon];
    let max = getWeaponStat(currentWeapon, 'maxAmmo');
    let pct = Math.max(0, Math.min(1, current / max));
    let lvl = weaponUpgradeLevels[currentWeapon];

    tacticalCtx.fillStyle = '#21140e';
    tacticalCtx.fillRect(0, 0, 512, 512);

    let themeColor = currentWeapon === 5 ? '#00ffff' : (lvl > 0 ? '#ffaa00' : '#b8860b');
    tacticalCtx.strokeStyle = themeColor;
    tacticalCtx.lineWidth = 12;
    tacticalCtx.strokeRect(10, 10, 492, 492);

    tacticalCtx.fillStyle = '#ffd700';
    tacticalCtx.font = 'bold 22px monospace';
    tacticalCtx.textAlign = 'left';
    tacticalCtx.fillText("AMMO", 30, 42);

    tacticalCtx.fillStyle = '#ffffff';
    tacticalCtx.font = '900 76px monospace';
    let countStr = current < 10 ? `00${current}` : (current < 100 ? `0${current}` : `${current}`);
    tacticalCtx.fillText(countStr, 30, 110);

    tacticalCtx.font = 'bold 30px monospace';
    tacticalCtx.textAlign = 'right';
    tacticalCtx.fillStyle = lvl > 0 ? '#ffaa00' : '#ffd700';
    tacticalCtx.fillText(lvl > 0 ? `LVL ${toRoman(lvl)}` : 'STD', 482, 65);
    tacticalCtx.fillStyle = '#b8860b';
    tacticalCtx.fillText(`/${max}`, 482, 105);

    tacticalCtx.fillStyle = '#3a2418';
    tacticalCtx.fillRect(30, 135, 452, 26);

    let barColor = '#ffaa00';
    if (pct <= 0.35) barColor = '#ff8800';
    if (pct <= 0.15) barColor = '#ff2222';

    tacticalCtx.fillStyle = barColor;
    tacticalCtx.fillRect(34, 139, Math.max(0, 444 * pct), 18);

    if (hasQuickRevive) {
        tacticalCtx.fillStyle = '#00a8ff';
        tacticalCtx.font = 'bold 18px monospace';
        tacticalCtx.textAlign = 'left';
        tacticalCtx.fillText("QUICK REVIVE SHIELD", 30, 185);

        tacticalCtx.fillStyle = '#3a2418';
        tacticalCtx.fillRect(30, 195, 452, 18);
        tacticalCtx.fillStyle = '#00a8ff';
        tacticalCtx.fillRect(34, 198, Math.max(0, 444 * (quickReviveShield / 2)), 12);
    }

    tacticalCtx.strokeStyle = '#5a3d28';
    tacticalCtx.lineWidth = 4;
    tacticalCtx.beginPath();
    tacticalCtx.moveTo(30, 230);
    tacticalCtx.lineTo(482, 230);
    tacticalCtx.stroke();

    tacticalCtx.fillStyle = '#ffd700';
    tacticalCtx.font = 'bold 22px monospace';
    tacticalCtx.fillText(`GRENADES (LVL ${toRoman(grenadeUpgradeLevel+1)})`, 30, 265);

    for (let i = 0; i < 2; i++) {
        let gx = 40 + (i * 55);
        let gy = 285;
        let isActive = i < grenadeCount;

        tacticalCtx.fillStyle = isActive ? '#ff5500' : '#443322';
        tacticalCtx.beginPath();
        tacticalCtx.arc(gx + 15, gy + 22, 14, 0, Math.PI * 2);
        tacticalCtx.fill();
        tacticalCtx.fillRect(gx + 10, gy + 3, 10, 8);
    }

    tacticalCtx.fillStyle = '#ffd700';
    tacticalCtx.fillText(`CLAYMORES (LVL ${toRoman(claymoreUpgradeLevel+1)})`, 260, 265);

    for (let i = 0; i < 2; i++) {
        let cx = 270 + (i * 75);
        let cy = 290;
        let isActive = i < claymoreCount;

        tacticalCtx.fillStyle = isActive ? '#ffaa00' : '#554422';
        tacticalCtx.beginPath();
        tacticalCtx.moveTo(cx, cy + 18);
        tacticalCtx.lineTo(cx + 45, cy + 18);
        tacticalCtx.lineTo(cx + 38, cy);
        tacticalCtx.lineTo(cx + 7, cy);
        tacticalCtx.closePath();
        tacticalCtx.fill();
    }

    tacticalCtx.strokeStyle = '#5a3d28';
    tacticalCtx.beginPath();
    tacticalCtx.moveTo(30, 340);
    tacticalCtx.lineTo(482, 340);
    tacticalCtx.stroke();

    let perkBadges = [
        { name: "JUG", active: hasJuggerNog, color: "#ff2222" },
        { name: "REV", active: hasQuickRevive, color: "#00a8ff" },
        { name: "DT2", active: hasDoubleTap, color: "#ffaa00" },
        { name: "STA", active: hasStaminUp, color: "#ffff00" }
    ];

    tacticalCtx.fillStyle = '#ffd700';
    tacticalCtx.font = 'bold 16px monospace';
    tacticalCtx.textAlign = 'left';
    tacticalCtx.fillText("BLESSINGS & PERKS", 30, 365);

    perkBadges.forEach((p, idx) => {
        let bx = 30 + (idx * 115);
        let by = 378;

        tacticalCtx.fillStyle = p.active ? p.color : '#3a2418';
        tacticalCtx.fillRect(bx, by, 100, 28);
        tacticalCtx.strokeStyle = p.active ? '#ffffff' : '#6b4c35';
        tacticalCtx.lineWidth = 2;
        tacticalCtx.strokeRect(bx, by, 100, 28);

        tacticalCtx.fillStyle = p.active ? '#000000' : '#b8860b';
        tacticalCtx.font = 'bold 16px monospace';
        tacticalCtx.textAlign = 'center';
        tacticalCtx.fillText(p.name, bx + 50, by + 19);
    });

    tacticalCtx.fillStyle = playerBites >= maxBites ? '#ff0055' : '#ffd700';
    tacticalCtx.font = 'bold 18px monospace';
    tacticalCtx.textAlign = 'left';
    tacticalCtx.fillText(`HEALTH (${maxBites - playerBites}/${maxBites} BITES)`, 30, 440);

    let activeHearts = Math.max(0, maxBites - playerBites);
    for (let i = 0; i < maxBites; i++) {
        let hx = 30 + (i * (420 / maxBites));
        let hy = 450;
        let isAlive = i < activeHearts;

        tacticalCtx.fillStyle = isAlive ? '#ff0055' : '#44222a';
        tacticalCtx.beginPath();
        let x = hx + 15;
        let y = hy + 12;
        tacticalCtx.moveTo(x, y);
        tacticalCtx.bezierCurveTo(x, y - 6, x - 15, y - 15, x - 15, y - 3);
        tacticalCtx.bezierCurveTo(x - 15, y + 9, x, y + 18, x, y + 24);
        tacticalCtx.bezierCurveTo(x, y + 18, x + 15, y + 9, x + 15, y - 3);
        tacticalCtx.bezierCurveTo(x + 15, y - 15, x, y - 6, x, y);
        tacticalCtx.fill();
    }

    gunTacticalTexture.needsUpdate = true;
}

function updateEquipmentUI() {
    updateTacticalHUD();
}

function damagePlayer() {
    if (isGameOver || isDowned) return;

    if (hasQuickRevive && quickReviveShield > 0) {
        quickReviveShield--;
        updateTacticalHUD();
        $('damage-overlay').style.backgroundColor = "rgba(0, 168, 255, 0.4)";
        setTimeout(() => { $('damage-overlay').style.backgroundColor = "rgba(255,0,0,0)"; }, 150);
        txtDiv.innerHTML = "QUICK REVIVE SHIELD ABSORBED BITE!";
        if (quickReviveShield <= 0) {
            hasQuickRevive = false;
            updateTacticalHUD();
            txtDiv.innerHTML = "QUICK REVIVE SHIELD DEPLETED!";
        }
        return;
    }

    playerBites++;
    updateTacticalHUD();

    $('damage-overlay').style.backgroundColor = "rgba(255, 0, 0, 0.4)";
    setTimeout(() => { $('damage-overlay').style.backgroundColor = "rgba(255,0,0,0)"; }, 150);

    if (playerBites >= maxBites) {
        isDowned = true;
        txtDiv.innerHTML = "YOU ARE DOWNED! CALL FOR A TEAMMATE TO HOLD LMB ON YOU.";
    } else {
        txtDiv.innerHTML = "YOU WERE BITTEN! FALL BACK!";
    }
}

function triggerGameOver() {
    isGameOver = true;
    document.exitPointerLock();
    promptDiv.style.display = 'flex';
    $('main-menu').style.display = 'block';
    $('lobby-screen').style.display = 'none';
}

function startRound(roundNum) {
    currentRound = roundNum;
    $('round-val').innerText = toRoman(currentRound);

    zombiesToSpawnRemaining = 4 + Math.floor(currentRound * 2.5);
    activeZombiesCount = 0;
    spawnInterval = Math.max(600, 2500 - (currentRound * 120)); 
    roundActive = true;

    txtDiv.innerHTML = `ROUND ${toRoman(currentRound)} HAS COMMENCED!`;
}

function checkRoundEnd() {
    if (!roundActive) return;
    const remainingLivingZombies = activeZombies.filter(z => !z.deadAndShrinking).length;

    if (zombiesToSpawnRemaining === 0 && remainingLivingZombies === 0) {
        roundActive = false;
        txtDiv.innerHTML = `ROUND ${toRoman(currentRound)} CLEARED. THE MANSION QUIETS...`;

        setTimeout(() => {
            if (!isGameOver) {
                startRound(currentRound + 1);
            }
        }, 4000); 
    }
}

function attachTacticalDisplay(group, scale = 1.0) {
    const screenHousing = new THREE.Mesh(
        new THREE.BoxGeometry(0.09 * scale, 0.11 * scale, 0.015 * scale),
        new THREE.MeshStandardMaterial({ color: 0x2b1d14, metalness: 0.5, roughness: 0.4 })
    );
    const screenFace = new THREE.Mesh(
        new THREE.PlaneGeometry(0.082 * scale, 0.102 * scale),
        new THREE.MeshBasicMaterial({ map: gunTacticalTexture, toneMapped: false })

    screenHousing.rotation.set(0, -Math.PI / 2, 0);

}

function buildWeaponGeometry(weaponId, isUpgraded) {
    const group = new THREE.Group();
    let matColor = 0x3a2e25;
    if (weaponId === 2) matColor = 0x4a3b32;
    if (weaponId === 3) matColor = 0x5c4a3d;
    if (weaponId === 4) matColor = 0x333333;
    if (weaponId === 5) matColor = 0x00ffcc;
    if (weaponId === 6) {
        let gMesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), new THREE.MeshStandardMaterial({ color: 0x444433, roughness: 0.7 }));
        group.add(gMesh);
        return group;
    }
    if (weaponId === 7) {
        let cMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.25, 0.1), new THREE.MeshStandardMaterial({ color: 0x555544 }));
        group.add(cMesh);
        return group;
    }

    let frameMat = new THREE.MeshStandardMaterial({ 
        color: isUpgraded ? 0xffaa00 : matColor, 
        metalness: isUpgraded ? 0.95 : 0.6, 
        roughness: isUpgraded ? 0.1 : 0.4,
        emissive: isUpgraded ? 0xff5500 : 0x000000,
        emissiveIntensity: isUpgraded ? 0.4 : 0.0
    });
    let accentMat = new THREE.MeshStandardMaterial({ color: isUpgraded ? 0xffff00 : 0xffd700, metalness: 0.7 });

    if (weaponId === 1) {
        let receiver = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.14, 0.3), frameMat); receiver.position.set(0, 0, 0);
        let grip = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.16, 0.08), frameMat); grip.position.set(0, -0.12, -0.06); grip.rotation.x = -0.2;
        let slide = new THREE.Mesh(new THREE.BoxGeometry(0.076, 0.06, 0.31), accentMat); slide.position.set(0, 0.09, 0.005);
        group.add(receiver, grip, slide);
    } else if (weaponId === 2) {
        let receiver = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 0.32), frameMat);
        let grip = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.18, 0.09), frameMat); grip.position.set(0, -0.13, -0.05);
        let mag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.06), accentMat); mag.position.set(0, -0.22, -0.03);
        let comp = new THREE.Mesh(new THREE.BoxGeometry(0.084, 0.07, 0.08), accentMat); comp.position.set(0, 0.08, 0.18);
        group.add(receiver, grip, mag, comp);
    } else if (weaponId === 3) {
        let receiver = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.18, 0.6), frameMat);
        let barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.8, 12), accentMat); barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.04, 0.6);
        let stock = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.24, 0.4), frameMat); stock.position.set(0, -0.08, -0.45);
        let pump = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3, 12), accentMat); pump.rotation.x = Math.PI/2; pump.position.set(0, -0.02, 0.45);
        group.add(receiver, barrel, stock, pump);
    } else if (weaponId === 4) {
        let body = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.18, 0.6), frameMat);
        let handguard = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.14, 0.4), accentMat); handguard.position.set(0, -0.01, 0.4);
        let barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.5), frameMat); barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.02, 0.85);
        let mag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.26, 0.12), accentMat); mag.position.set(0, -0.18, 0.15); mag.rotation.x = 0.15;
        group.add(body, handguard, barrel, mag);
    } else if (weaponId === 5) {
        let generator = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), frameMat);
        let emitter = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.08, 0.45, 12), accentMat); emitter.rotation.x = Math.PI/2; emitter.position.set(0, 0.25);
        let energyRing = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.02, 6, 16), frameMat); energyRing.position.set(0, 0.38);
        let grip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.18, 0.07), accentMat); grip.position.set(0, -0.16, -0.06);
        group.add(generator, emitter, energyRing, grip);

        const screenHousing = new THREE.Mesh(
            new THREE.BoxGeometry(0.09, 0.11, 0.015),
            new THREE.MeshStandardMaterial({ color: 0x2b1d14, metalness: 0.5, roughness: 0.4 })
        );
        const screenFace = new THREE.Mesh(
            new THREE.PlaneGeometry(0.082, 0.102),
            new THREE.MeshBasicMaterial({ map: gunTacticalTexture, toneMapped: false })
        );
        screenFace.position.z = 0.009;
        screenHousing.add(screenFace);
        screenHousing.position.set(-0.16, 0.06, -0.02);
        screenHousing.rotation.set(0.1, -Math.PI / 2 + 0.2, 0.1);
        group.add(screenHousing);
    }
    return group;
}

function switchWeapon(id) {
    if (id === 2 && !hasAutomaticPistol) { txtDiv.innerHTML = "BUY THE AUTO PISTOL FROM THE MANSION WALL FIRST!"; return; }
    if (id === 3 && !hasRifle) { txtDiv.innerHTML = "BUY THE HEAVY SHOTGUN FROM THE MANSION WALL FIRST!"; return; }
    if (id === 4 && !hasAutoRifle) { txtDiv.innerHTML = "BUY THE RIFLE FROM THE MANSION WALL FIRST!"; return; }
    if (id === 5 && !hasRayPistol) { txtDiv.innerHTML = "RAY PISTOL MUST BE FOUND IN THE RELIC CHEST!"; return; }
    if (upgradeMachineActive && upgradeMachineWeaponSlot === id) { txtDiv.innerHTML = "THAT WEAPON IS CURRENTLY BEING BLESSED!"; return; }

    currentWeapon = id;
    let isUpgraded = weaponUpgradeLevels[currentWeapon] > 0;
    while(gunMeshGroup.children.length > 0) { gunMeshGroup.remove(gunMeshGroup.children[0]); }

    let builtGun = buildWeaponGeometry(currentWeapon, isUpgraded);
    gunMeshGroup.add(builtGun);
    attachTacticalDisplay(gunMeshGroup, 1.3);

    updateTacticalHUD();
    let lvlStr = isUpgraded ? ` [LEVEL ${toRoman(weaponUpgradeLevels[currentWeapon])}]` : "";
    txtDiv.innerHTML = `WEAPON SWITCHED TO: ${baseWeaponData[currentWeapon].name}${lvlStr}`;
}

function addStructuralMesh(geo, mat, px, py, pz, rx=0, ry=0, materialType = "stone") {
    const mesh = new THREE.Mesh(geo, mat); 
    mesh.position.set(px, py, pz); 
    if(rx) mesh.rotation.x = rx; 
    if(ry) mesh.rotation.y = ry; 
    scene.add(mesh);
    const line = new THREE.LineSegments(new THREE.EdgesGeometry(geo), outlineMat); 
    line.position.copy(mesh.position); 
    line.rotation.copy(mesh.rotation); 
    scene.add(line);
    mesh.userData = { materialType: materialType }; 
    generalEnvironmentMeshes.push(mesh); 
    return mesh;
}

function animate(t) {
    requestAnimationFrame(animate); 
    updateUpgradeMachineScreen(); upgScreenTexture.needsUpdate = true;
    updateMysteryBoxScreen(); boxScreenTexture.needsUpdate = true;
    let now = performance.now();
    if (isGameOver) return;

    if (isLmbHeldDown && !isDowned && (currentWeapon === 2 || currentWeapon === 4 || currentWeapon === 5)) { 
        let effectiveFireRate = hasDoubleTap ? autoFireRateMs / 2 : autoFireRateMs;
        if (now - lastShotTime > (currentWeapon === 5 ? effectiveFireRate * 0.8 : effectiveFireRate)) { 
            executeWeaponFireRaycast(); 
            lastShotTime = now; 
        } 
    }

    let moveVector = new THREE.Vector3(0, 0, 0);
    if (!isDowned) {
        if (keys.w) moveVector.z -= 1; if (keys.s) moveVector.z += 1;
        if (keys.a) moveVector.x -= 1; if (keys.d) moveVector.x += 1;
    }
    moveVector.normalize().applyQuaternion(playerRig.quaternion); moveVector.y = 0;

    let walkSpeed = hasStaminUp ? 0.50 : 0.35;
    let nextPos = playerRig.position.clone().addScaledVector(moveVector, walkSpeed); 
    playerRig.position.copy(nextPos);

    if (isMultiplayer) {
        socket.emit('player_move', { x: playerRig.position.x, y: playerRig.position.y, z: playerRig.position.z, yaw: playerYaw, pitch: playerPitch });
    }

    renderer.render(scene, camera);
}
window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
animate(0);
