<html lang="en">

    #gui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    
    #stats { position: absolute; top: 6px; left: 8px; font-size: 10px; font-weight: 700; background: rgba(30,20,15,.9); color: #d4af37; padding: 3px 6px; border: 1px solid #6b4c35; max-width: 50vw; line-height: 1.2; }

    #round-display { position: absolute; bottom: 8px; left: 135px; font-size: 26px; font-weight: 700; color: #c22; text-shadow: 2px 2px #000; pointer-events: none; }
    #msg-box { position: absolute; top: 85px; width: 100%; text-align: center; left: 0; pointer-events: none; }
    #text { display: inline-block; background: rgba(35,24,18,.95); color: #f0e0d0; border: 2px solid #8b5a2b; padding: 4px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; box-shadow: 0 4px 10px rgba(0,0,0,.5); max-width: 90vw; }
    
    #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%,-50%); pointer-events: none; }
    #crosshair::after,#crosshair::before { content:''; position: absolute; background: #fa0; }
    #crosshair::before { top: 4px; left: -10px; width: 30px; height: 2px; }
    #crosshair::after { top: -10px; left: 4px; width: 2px; height: 30px; }
    #click-prompt{position:absolute;inset:0;background:rgba(15,10,8,.9);color:#d4af37;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;cursor:pointer;pointer-events:auto;text-transform:uppercase;z-index:100}
    #damage-overlay{position:absolute;inset:0;background:rgba(255,0,0,0);pointer-events:none;transition:background .1s ease;z-index:5}

    #squad-board { position: absolute; top: 40px; right: 8px; font-size: 11px; font-weight: 700; background: #140d0a; color: #fa0; padding: 6px 10px; border: 2px solid #8b5a2b; display: none; z-index: 25; line-height: 1.4; }

    @media (pointer: coarse) {
      #crosshair { display: none !important; }
    }

    /* Mobile Controls Dashboard */
    #mobile-controls { position: absolute; inset: 0; pointer-events: none; z-index: 20; display: none; }
    .touch-interactive { pointer-events: auto; }
    
    #dpad { position: absolute; bottom: 42px; left: 10px; width: 115px; height: 115px; }
    .dpad-btn { position: absolute; width: 36px; height: 36px; background: rgba(43,24,16,0.85); border: 2px solid #d4af37; border-radius: 6px; color: #d4af37; font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,0.5); }

    #dpad-down { bottom: 0; left: 39.5px; }
    #dpad-left-dir { top: 39.5px; left: 0; }
    #dpad-right-dir { top: 39.5px; right: 0; }

    .w-btn { width: 28px; height: 28px; background: rgba(20,13,10,0.9); border: 1px solid #8b5a2b; color: #ffd700; font-weight: bold; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
  </style>

      else if(id===4){let bd=MESH(BG(0.1,0.18,0.6),fm),h=MESH(BG(0.09,0.14,0.4),am,0,-0.01,0.4),b=MESH(CG(0.018,0.018,0.5),fm,0,0.02,0.85,Math.PI/2),m=MESH(BG(0.06,0.26,0.12),am,0,-0.18,0.15,0.15);g.add(bd,h,b,m)}
      else if(id===5){let gen=MESH(SG(0.14),fm),em=MESH(CG(0.02,0.08,0.45,12),am,0,0.25,0,Math.PI/2),er=MESH(new T.TorusGeometry(0.12,0.02,6,16),fm,0,0.38,0),gp=MESH(BG(0.06,0.18,0.07),am,0,-0.16,-0.06);g.add(gen,em,er,gp);let sh=MESH(BG(0.09,0.11,0.015),SM({color:0x2b1d14,metalness:0.5,roughness:0.4}),-0.16,0.06,-0.02,0.1,-Math.PI/2+0.2),sf=MESH(PG(0.082,0.102),BM({map:gunTacticalTexture,toneMapped:false}),0,0,0.009);sh.rotation.z=0.1;sh.add(sf);g.add(sh)}
      return g;
    }
    
    function switchWeapon(id){
      if(id===2&&!hasAutomaticPistol){txtDiv.innerHTML="BUY THE AUTO PISTOL FROM THE MANSION WALL FIRST!";return}
      if(id===3&&!hasRifle){txtDiv.innerHTML="BUY THE HEAVY SHOTGUN FROM THE MANSION WALL FIRST!";return}
      if(id===4&&!hasAutoRifle){txtDiv.innerHTML="BUY THE RIFLE FROM THE MANSION WALL FIRST!";return}
      if(id===5&&!hasRayPistol){txtDiv.innerHTML="RAY PISTOL MUST BE FOUND IN THE RELIC CHEST!";return}
      if(upgradeMachineActive&&upgradeMachineWeaponSlot===id){txtDiv.innerHTML="THAT WEAPON IS CURRENTLY BEING BLESSED!";return}
      currentWeapon=id;let upg=weaponUpgradeLevels[currentWeapon]>0;while(gunMeshGroup.children.length>0)gunMeshGroup.remove(gunMeshGroup.children[0]);
      gunMeshGroup.add(buildWeaponGeometry(currentWeapon,upg));attachTacticalDisplay(gunMeshGroup,1.3);updateTacticalHUD();
      txtDiv.innerHTML=`WEAPON SWITCHED TO: ${baseWeaponData[currentWeapon].name}${upg?` [LEVEL ${toRoman(weaponUpgradeLevels[currentWeapon])}]`:""}`;
    }

    const keys={w:0,a:0,s:0,d:0,shift:0};

    function setupTouchButton(id, keyName, isAction = false, actionFunc = null) {
      const el = $(id);
      if(!el) return;
      el.addEventListener('touchstart', e => {
        e.preventDefault();
        if (isAction && actionFunc) {
          actionFunc();
        } else {
          keys[keyName] = 1;
        }
      });
      el.addEventListener('touchend', e => {
        e.preventDefault();
        if (!isAction) {
          keys[keyName] = 0;
        }
      });
    }

    setupTouchButton('dpad-up', 'w');
    setupTouchButton('dpad-down', 's');
    setupTouchButton('dpad-left-dir', 'a');
    setupTouchButton('dpad-right-dir', 'd');
    setupTouchButton('btn-nade', null, true, throwGrenade);
    setupTouchButton('btn-clay', null, true, placeClaymore);

    window.addEventListener('keydown',e=>{if(isGameOver)return;if(e.code==='KeyW')keys.w=1;if(e.code==='KeyS')keys.s=1;if(e.code==='KeyA')keys.a=1;if(e.code==='KeyD')keys.d=1;if(e.code==='ShiftLeft'||e.code==='ShiftRight')keys.shift=1;if(e.code==='Digit1')switchWeapon(1);if(e.code==='Digit2')switchWeapon(2);if(e.code==='Digit3')switchWeapon(3);if(e.code==='Digit4')switchWeapon(4);if(e.code==='Digit5')switchWeapon(5);if(e.code==='KeyG')throwGrenade();if(e.code==='KeyC')placeClaymore()});
    window.addEventListener('keyup',e=>{if(e.code==='KeyW')keys.w=0;if(e.code==='KeyS')keys.s=0;if(e.code==='KeyA')keys.a=0;if(e.code==='KeyD')keys.d=0;if(e.code==='ShiftLeft'||e.code==='ShiftRight')keys.shift=0});

    let lookTouchId = null;
    let lastTouchX = null, lastTouchY = null;
    const lookPad = $('look-pad');

    if(lookPad) {
      lookPad.addEventListener('touchstart', e => {
        e.preventDefault();
        if (lookTouchId !== null) return;
        const t = e.changedTouches[0];
        lookTouchId = t.identifier;
        lastTouchX = t.clientX;
        lastTouchY = t.clientY;
      });

      lookPad.addEventListener('touchmove', e => {
        e.preventDefault();
        if (lastTouchX === null || isGameOver) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === lookTouchId) {
            const dx = t.clientX - lastTouchX;
            const dy = t.clientY - lastTouchY;
            lastTouchX = t.clientX;
            lastTouchY = t.clientY;

            playerYaw -= dx * 0.006;
            playerRig.rotation.y = playerYaw;
            playerPitch = Math.max(-1.4, Math.min(1.4, playerPitch - dy * 0.006));
            cameraPitchObject.rotation.x = playerPitch;
          }
        }
      });

      function resetLookPad(e) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === lookTouchId) {
            lookTouchId = null;
            lastTouchX = lastTouchY = null;
          }
        }
      }
      lookPad.addEventListener('touchend', resetLookPad);
      lookPad.addEventListener('touchcancel', resetLookPad);
    }

    // Tapping anywhere on screen fires on mobile (crosshair-less firing)
    window.addEventListener('touchstart', e => {
      if (isGameOver || !isMobile || e.target.tagName.includes('BUTTON') || e.target.closest('#mobile-controls') || e.target.closest('#click-prompt')) return;
      executeWeaponFireRaycast();
    });

    // --- Click Prompt Handler maintaining Desktop pointer lock & Mobile init ---
    promptDiv.onclick = () => {
      initAudio();
      if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      
      if (!isMobile) {
        document.body.requestPointerLock().catch(err => {
          console.log("Pointer lock failed:", err);
        });
      }
      
      promptDiv.style.display = 'none';
      if(!roundActive && currentRound === 1) {
        startRound(1);
      }
    };

    document.addEventListener('pointerlockchange',()=>{
      if(document.pointerLockElement===document.body){
        promptDiv.style.display='none';
        initAudio();
        if(!roundActive&&currentRound===1)startRound(1)
      } else if(!isGameOver && !isMobile){
        promptDiv.style.display='flex';
        isLmbHeldDown=false;
      }
    });

    let audioCtx=null,audioListener=null;const scene=new T.Scene(),defaultBG=new T.Color(0x120d0a),underwaterBG=new T.Color(0x0a1624),caveBG=new T.Color(0x080605);scene.background=defaultBG;
    const camera=new T.PerspectiveCamera(isMobile ? 75 : 65,window.innerWidth/window.innerHeight,0.1,1000);camera.rotation.order='YXZ';
    const playerRig=GRP();playerRig.position.set(0,3,15);scene.add(playerRig);
    const cameraPitchObject=GRP();playerRig.add(cameraPitchObject);cameraPitchObject.add(camera);
    const pistolGroup=GRP();pistolGroup.position.set(isMobile ? 0.22 : 0.28, isMobile ? -0.32 : -0.28, isMobile ? -0.48 : -0.55);cameraPitchObject.add(pistolGroup);
    const gunMeshGroup=GRP();pistolGroup.add(gunMeshGroup);
    const muzzleFlash=new T.PointLight(0xffaa00,0,10);pistolGroup.add(muzzleFlash);
    let playerYaw=0,playerPitch=0;const raycaster=new T.Raycaster();
    scene.add(new T.AmbientLight(0xffeedd,1.4));const sunLight=new T.DirectionalLight(0xfff5ee,1);sunLight.position.set(30,60,30);scene.add(sunLight);
    
    // Core raycast action function (handles shooting, filling holes via shooting, etc.)
    function executeWeaponFireRaycast() {
      if(isGameOver)return;
      playPistolShotSound();
      muzzleFlash.intensity=3;setTimeout(()=>muzzleFlash.intensity=0,50);
      
      // Raycasting forward from camera to hit objects, enemies, or holes
      raycaster.setFromCamera(new T.Vector2(0, 0), camera);
      let intersects = raycaster.intersectObjects(scene.children, true);
      
      if(intersects.length > 0) {
        let hit = intersects[0];
        // Filling holes via shooting if in range (< 15 units)
        if(hit.object.userData && hit.object.userData.materialType === "pit_void" && hit.point.distanceTo(playerRig.position) < 15) {
          fillHoleWithDirt(hit.object.userData.holeIndex);
        }
      }
    }

    function simulateStickmanMatch() {}

    function fillHoloGroupWithRewardModel() {}
    function fillHoloGroupWithWeaponModel() {}
    function initAudio() {}

    const renderer = new T.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    function animate(t){
      requestAnimationFrame(animate);
      if(isGameOver)return;
      renderer.render(scene,camera);
    }
    animate(0);
